[workspace]
members = [
    "crates/bridge-core",
    "crates/integration-tahoma",
    "crates/transport-homekit",
    "crates/bridge-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.0", default-features = false, features = ["serde"] }
tokio = { version = "=1.54.1", default-features = false, features = ["sync"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
