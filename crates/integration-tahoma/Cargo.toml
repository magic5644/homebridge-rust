[package]
name = "integration-tahoma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bridge-core = { path = "../bridge-core" }
mdns-sd = { version = "=0.21.6", default-features = false, features = ["async"] }
tokio = { workspace = true, features = ["time", "rt"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "test-util", "net", "io-util", "process"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws-lc-rs", "tls12"] }
